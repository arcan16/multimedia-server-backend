spring.application.name=MultimediaServer

spring.datasource.url= ${DB_URL_MULTIMEDIA}
spring.datasource.username= ${DB_USERNAME_MULTIMEDIA}
spring.datasource.password= ${DB_PASSWORD_MULTIMEDIA}
spring.datasource.driver-class-name= com.mysql.cj.jdbc.Driver
spring.jpa.show-sql = true
# Flyway es dueño del esquema: Hibernate no genera DDL y usa los nombres de @Table/@Column tal cual
# (la estrategia por defecto pasaría USERS a "users", que falla en MySQL sobre Linux).
spring.jpa.hibernate.ddl-auto = none
spring.jpa.hibernate.naming.physical-strategy = org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

jwt.secret.key = ${jwt.secret.key}
jwt.expiration.key= ${jwt.expiration.key}

# Carpeta base de los posters: en la BD solo se guarda el nombre del archivo, relativo a esta carpeta.
app.storage.posters = ${POSTERS_PATH_MULTIMEDIA:./storage/posters}
app.storage.videos = ${VIDEOS_PATH_MULTIMEDIA:./storage/videos}
# Ejecutable de FFmpeg que calcula la duración de los vídeos (en el PATH o ruta absoluta).
app.ffprobe.path = ${FFPROBE_PATH_MULTIMEDIA:ffprobe}
# Límite global de subida (Spring limita a 1MB por defecto); pensado para vídeos.
# Los pósters tienen su propio límite de 5MB en MovieSeriesService.
spring.servlet.multipart.max-file-size = ${MAX_UPLOAD_SIZE_MULTIMEDIA:10GB}
spring.servlet.multipart.max-request-size = ${MAX_UPLOAD_SIZE_MULTIMEDIA:10GB}
